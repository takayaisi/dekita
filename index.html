<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6ec"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="style.css"><title>まいにち できた！</title></head>
<body><header><a class="brand" href="./">🌱 まいにち できた！</a><button id="settings" class="quiet">⚙ おうちのひと</button></header><main><div id="profiles" class="profiles" aria-label="だれのページ？"></div><section class="hero"><div><p class="eyebrow" id="date"></p><h1 id="greeting"></h1><p>ちいさな「できた！」を、まいにち。</p><div class="star-count" id="balance"></div></div><div class="garden" aria-label="できた！のき"><span class="cloud">☁</span><span id="tree">🌱</span><span class="flower">🌼 🌷 🌼</span></div></section><section><div class="section-title"><h2>きょうの やること</h2><span id="progressText"></span></div><progress id="progress" value="0" max="1"></progress><div id="tasks" class="tasks"></div><p id="cheer" role="status" aria-live="polite"></p></section><section class="reward"><div class="gift">🎁</div><div><p class="eyebrow">つぎの おたのしみ</p><h2 id="rewardTitle"></h2><p id="rewardStatus"></p></div></section><footer>できたぶんだけ、はなまる。あしたも じぶんのペースで。<br><small>記録はこの端末に保存されます。端末どうしの同期はありません。</small><p id="notice" role="status"></p><button id="update" hidden>新しいバージョンに更新</button></footer></main>
<dialog id="parent"><form id="parentForm"><div class="section-title"><h2>おうちのひとの設定</h2><button type="button" id="close">閉じる</button></div><div id="gate"><p id="gateHint"></p><label>4けたの暗証番号<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off"></label><button type="button" id="unlock" class="primary">開く</button><p id="gateError" role="alert"></p></div><div id="editor" hidden><p class="hint">暗証番号は子供の誤操作を防ぐ簡易ロックです。</p><div class="two"><label>1人目の名前<input id="name0" maxlength="16"></label><label>2人目の名前<input id="name1" maxlength="16"></label></div><h3>毎日やること</h3><div id="taskEditor"></div><button type="button" id="addTask">＋ やることを追加</button><label>ご褒美<input id="rewardInput" maxlength="60"></label><label>交換に必要な星<input id="cost" type="number" min="1" max="999" required></label><button type="submit" class="primary">設定を保存</button><hr><h3>ご褒美の交換</h3><p id="exchangeInfo"></p><button type="button" id="exchange">星を使って交換する</button><hr><h3>記録のバックアップ</h3><button type="button" id="export">保存ファイルをダウンロード</button><label>保存ファイルから復元<input type="file" id="import" accept="application/json,.json"></label><p class="hint">復元すると現在の記録を置き換えます。暗証番号を忘れた場合も、バックアップから復元できます。</p></div></form></dialog><script src="app.js" defer></script></body></html>
